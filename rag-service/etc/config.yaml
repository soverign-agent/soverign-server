Database:
  Host: localhost
  Port: 5432
  User: postgres
  Password: postgres
  Database: sovereign
  SSLMode: disable

LLM:
  Provider: openai
  APIKey: ""
  BaseURL: ""
  EmbeddingModel: text-embedding-3-small
  Timeout: 30
  MaxTokens: 1000
  Temperature: 0.0

Chunking:
  DefaultChunkSize: 1000
  DefaultChunkOverlap: 200

GRPC:
  Port: 9082
  Insecure: true # local dev only; production must set tls_cert_file and tls_key_file
