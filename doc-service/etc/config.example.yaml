Database:
  Host: localhost
  Port: 5432
  User: sovereign
  Password: your-password-here
  Database: sovereign
  SSLMode: disable

LLM:
  Provider: openai
  APIKey: "your-api-key-here"
  BaseURL: ""
  Model: gpt-4o
  Timeout: 120s
  MaxTokens: 4096
  Temperature: 0.7

Export:
  output_dir: ./exports
  default_format: pdf
  max_file_size_mb: 50

GRPC:
  Port: 9888
  TLSCertFile: ""
  TLSKeyFile: ""
  Insecure: true # local dev only; production must set tls_cert_file and tls_key_file

Clients:
  OrgAddr: localhost:9085
  AuditAddr: localhost:9086
  RAGAddr: localhost:9082
  Insecure: true # local dev only
