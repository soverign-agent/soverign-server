Database:
  Host: localhost
  Port: 5432
  User: sovereign
  Password: sovereign-dev-password
  Database: sovereign
  SSLMode: disable

LLM:
  Provider: openai
  APIKey: ${OPENAI_API_KEY}
  BaseURL: ""
  Model: gpt-4o
  Timeout: 120
  MaxTokens: 4096
  Temperature: 0.7

Export:
  OutputDir: ./exports
  DefaultFormat: pdf
  MaxFileSizeMB: 50

GRPC:
  Port: 9888
  Insecure: true # local dev only; production must set tls_cert_file and tls_key_file

Clients:
  OrgAddr: localhost:9085
  AuditAddr: localhost:9086
  RAGAddr: localhost:9082
  Insecure: true # local dev only
